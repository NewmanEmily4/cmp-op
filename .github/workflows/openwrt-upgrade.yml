name: OpenWrt upgrade and build

on:
  workflow_dispatch:
    inputs:
      old_config_url:
        description: Public URL of the old OpenWrt .config file
        required: true
        type: string
      source_ref:
        description: Target OpenWrt tag or branch; leave empty to use v<DESTVER>
        required: false
        default: ""
        type: string
      run_download:
        description: Download package sources after manual review
        required: true
        default: "yes"
        type: choice
        options:
          - "yes"
          - "no"
      run_build:
        description: Build the firmware after manual review
        required: true
        default: "no"
        type: choice
        options:
          - "yes"
          - "no"
      single_thread_build:
        description: Build firmware with a single make job
        required: true
        default: false
        type: boolean
      debug_ssh:
        description: Open an SSH session before firmware compilation
        required: true
        default: false
        type: boolean


permissions:
  contents: read
  actions: read

concurrency:
  group: openwrt-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      target_tag: ${{ steps.target.outputs.tag }}
    steps:
      - name: Install OpenWrt host dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates file flex gawk gettext git libncurses-dev \
            libncursesw5-dev libssl-dev python3 python3-setuptools rsync subversion \
            unzip wget zlib1g-dev

      - name: Download old configuration and select target source
        id: target
        shell: bash
        env:
          CONFIG_URL: ${{ inputs.old_config_url }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          mkdir -p review
          wget --https-only --server-response --retry-connrefused --waitretry=3 \
            --tries=3 -O old.config "$CONFIG_URL"

          version="$(grep 'DESTVER=' old.config | head -n 1 | cut -d= -f2- | tr -d '\r')"
          if [[ -z "$version" && -z "$SOURCE_REF" ]]; then
            echo 'DESTVER was not found and source_ref was not supplied.' >&2
            exit 1
          fi

          target_tag="${SOURCE_REF:-v$version}"
          printf '%s\n' "$target_tag" > review/target-tag.txt
          printf 'DESTVER=%s\nTarget source=%s\n' "$version" "$target_tag" > review/selection.txt
          echo "tag=$target_tag" >> "$GITHUB_OUTPUT"

          git clone --depth 1 --no-tags --branch "$target_tag" \
            https://github.com/openwrt/openwrt.git openwrt

      - name: Generate migrated configuration
        working-directory: openwrt
        shell: bash
        run: |
          set -euo pipefail
          cp ../old.config .config
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig
          ./scripts/diffconfig.sh > ../review/my_private_tools.config
          cp .config ../review/old-config-after-defconfig

          if [[ ! -s ../review/my_private_tools.config ]]; then
            echo 'The extracted configuration is empty; refusing to continue.' >&2
            exit 1
          fi

          {
            printf 'Target source: '
            cat ../review/target-tag.txt
            printf '\nSelected packages:\n'
            grep '^CONFIG_PACKAGE_' ../review/my_private_tools.config || true
          } > ../review/config-report.txt

      - name: Upload configuration for manual review
        uses: actions/upload-artifact@v5
        with:
          name: openwrt-config-review-${{ github.run_id }}
          path: review/
          if-no-files-found: error
          retention-days: 14

  manual-review:
    name: Wait for manual review
    needs: prepare
    runs-on: ubuntu-24.04
    environment:
      name: openwrt-review
    steps:
      - name: Approval received
        run: |
          echo 'Manual approval received for target: ${{ needs.prepare.outputs.target_tag }}'
          echo 'Review the openwrt-config-review artifact before approving this environment.'

  build:
    name: Apply configuration and build
    needs: [prepare, manual-review]
    if: ${{ inputs.run_download == 'yes' || inputs.run_build == 'yes' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check Server Performance
        shell: bash
        run: |
          echo "警告⚠"
          echo "分配的服务器性能有限，若选择的插件过多，务必注意CPU性能！"
          echo -e "已知CPU型号（降序）：7763，8370C，8272CL，8171M，E5-2673 \n"
          echo "--------------------------CPU信息--------------------------"
          echo "CPU物理数量：$(cat /proc/cpuinfo | grep "physical id" | sort | uniq | wc -l)"
          echo -e "CPU核心信息：$(cat /proc/cpuinfo | grep name | cut -f2 -d: | uniq -c) \n"
          echo "--------------------------内存信息--------------------------"
          echo "已安装内存详细信息："
          echo -e "$(sudo lshw -short -C memory | grep GiB) \n"
          echo "--------------------------硬盘信息--------------------------"
          echo "硬盘数量：$(ls /dev/sd* | grep -v [1-9] | wc -l)" && df -hT

      - name: Optimize Disk Space
        uses: hugoalh/disk-space-optimizer-ghaction@main
        with:
          operate_sudo: "True"
          general_include: ".+"
          general_exclude: |-
            ^GCC$
            ^G\+\+$
            Clang
            LLVM
          docker_include: ".+"
          docker_prune: "True"
          docker_clean: "True"
          apt_prune: "True"
          apt_clean: "True"
          homebrew_prune: "True"
          homebrew_clean: "True"
          npm_prune: "True"
          npm_clean: "True"
          os_swap: "True"

      - name: Install OpenWrt host dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates file flex gawk gettext git libncurses-dev \
            libncursesw5-dev libssl-dev python3 python3-setuptools rsync subversion \
            unzip wget zlib1g-dev

      - name: Download reviewed configuration
        uses: actions/download-artifact@v8.0.1
        with:
          name: openwrt-config-review-${{ github.run_id }}
          path: review

      - name: Determine parallel make jobs
        shell: bash
        env:
          SINGLE_THREAD_BUILD: ${{ inputs.single_thread_build }}
        run: |
          set -euo pipefail
          if [[ "$SINGLE_THREAD_BUILD" == 'true' ]]; then
            make_jobs=1
          elif [[ "$SINGLE_THREAD_BUILD" == 'false' ]]; then
            make_jobs="$(nproc)"
          else
            echo 'single_thread_build must be true or false.' >&2
            exit 1
          fi
          printf 'MAKE_JOBS=%s\n' "$make_jobs" >> "$GITHUB_ENV"
          echo "Using $make_jobs parallel make jobs."

      - name: Clone target source and apply configuration
        shell: bash
        env:
          TARGET_TAG: ${{ needs.prepare.outputs.target_tag }}
        run: |
          set -euo pipefail
          git clone --depth 1 --no-tags --branch "$TARGET_TAG" \
            https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig
          cat ../review/my_private_tools.config >> .config
          make defconfig
          cp .config ../review/final.config

      - name: Download package sources
        if: ${{ inputs.run_download == 'yes' }}
        working-directory: openwrt
        run: |
          set -euo pipefail
          mkdir -p ../review/logs
          make download -j"$(nproc)" 2>&1 | tee ../review/logs/make-download.log

      - name: Remove stale SSH continue signal
        if: ${{ inputs.debug_ssh && inputs.run_build == 'yes' }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$GITHUB_WORKSPACE/continue"

      - name: Open SSH debug session
        if: ${{ inputs.debug_ssh && inputs.run_build == 'yes' }}
        uses: owenthereal/action-upterm@v1
        with:
          detached: true
          limit-access-to-actor: true
          wait-timeout-minutes: 30

      - name: Wait for SSH continue signal
        if: ${{ inputs.debug_ssh && inputs.run_build == 'yes' }}
        shell: bash
        run: |
          set -euo pipefail
          echo 'SSH session is active. Run this command after debugging:'
          echo '  cd "$GITHUB_WORKSPACE" && touch continue'
          while [[ ! -f "$GITHUB_WORKSPACE/continue" ]]; do
            sleep 5
          done
          echo 'Continue signal received; starting firmware build.'

      - name: Build firmware
        if: ${{ inputs.run_build == 'yes' }}
        working-directory: openwrt
        run: |
          set -euo pipefail
          mkdir -p ../review/logs
          make -j"$MAKE_JOBS" V=s 2>&1 | tee ../review/logs/make-build.log

      - name: Upload build outputs and logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v8.0.1
        with:
          name: openwrt-build-${{ github.run_id }}
          path: |
            openwrt/bin/targets/
            openwrt/bin/packages/
            review/final.config
            review/logs/
          if-no-files-found: warn
          retention-days: 14
