name: OpenWrt upgrade and build

on:
  workflow_dispatch:
    inputs:
      old_config_url:
        description: Public URL of the old OpenWrt .config file
        required: true
        type: string
      source_ref:
        description: Target OpenWrt tag or branch; leave empty to use v<DESTVER>
        required: false
        default: ""
        type: string
      run_download:
        description: Download package sources before building
        required: true
        default: "yes"
        type: choice
        options:
          - "yes"
          - "no"
      run_build:
        description: Build the firmware after configuration
        required: true
        default: "yes"
        type: choice
        options:
          - "yes"
          - "no"
      single_thread_build:
        description: Build firmware with a single make job
        required: true
        default: false
        type: boolean
      debug_ssh:
        description: Open an SSH session before firmware compilation
        required: true
        default: true
        type: boolean

permissions:
  contents: write

# concurrency:
#   group: openwrt-${{ github.ref }}
#   cancel-in-progress: false

jobs:
  build:
    name: Prepare configuration and build
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check Server Performance
        shell: bash
        run: |
          echo "警告⚠"
          echo "分配的服务器性能有限，若选择的插件过多，务必注意CPU性能！"
          echo -e "已知CPU型号（降序）：7763，8370C，8272CL，8171M，E5-2673 \n"
          echo "--------------------------CPU信息--------------------------"
          echo "CPU物理数量：$(cat /proc/cpuinfo | grep "physical id" | sort | uniq | wc -l)"
          echo -e "CPU核心信息：$(cat /proc/cpuinfo | grep name | cut -f2 -d: | uniq -c) \n"
          echo "--------------------------内存信息--------------------------"
          echo "已安装内存详细信息："
          echo -e "$(sudo lshw -short -C memory | grep GiB) \n"
          echo "--------------------------硬盘信息--------------------------"
          echo "硬盘数量：$(ls /dev/sd* | grep -v [1-9] | wc -l)" && df -hT

      - name: Optimize Disk Space
        uses: hugoalh/disk-space-optimizer-ghaction@main
        with:
          operate_sudo: "True"
          general_include: ".+"
          general_exclude: |-
            ^GCC$
            ^G\+\+$
            Clang
            LLVM
          docker_include: ".+"
          docker_prune: "True"
          docker_clean: "True"
          apt_prune: "True"
          apt_clean: "True"
          homebrew_prune: "True"
          homebrew_clean: "True"
          npm_prune: "True"
          npm_clean: "True"
          os_swap: "True"

      - name: Install OpenWrt host dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates file flex gawk gettext git libncurses-dev \
            libncursesw5-dev libssl-dev python3 python3-setuptools rsync subversion \
            unzip wget zlib1g-dev nload jq zip

      - name: Determine target source
        id: target
        shell: bash
        env:
          CONFIG_URL: ${{ inputs.old_config_url }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          mkdir -p logs
          wget --https-only --server-response --retry-connrefused --waitretry=3 \
            --tries=3 -O old.config "$CONFIG_URL"

          version="$(grep 'DESTVER=' old.config | head -n 1 | cut -d= -f2- | tr -d '\r')"
          if [[ -z "$version" && -z "$SOURCE_REF" ]]; then
            echo 'DESTVER was not found and source_ref was not supplied.' >&2
            exit 1
          fi

          target_tag="${SOURCE_REF:-v$version}"
          echo "TARGET_TAG=$target_tag" >> "$GITHUB_ENV"
          echo "Using target source: $target_tag"

      - name: Clone target source and apply configuration
        shell: bash
        run: |
          set -euo pipefail

          sudo sed -i "1i alias next='touch /tmp/continue'" /etc/profile
          sudo sed -i "1i alias ll='ls -alF --color=auto'" /etc/profile
          sudo sed -i "1i alias grep='grep --color=auto'" /etc/profile
          sudo bash -c 'cat ~/.bashrc >> /etc/profile'

          git clone --depth 1 --no-tags --branch "$TARGET_TAG" \
            https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cp ../old.config .config
          make defconfig

      - name: Generate configuration diff document
        working-directory: openwrt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../logs
          old_normalized="$(mktemp)"
          new_normalized="$(mktemp)"
          trap 'rm -f "$old_normalized" "$new_normalized"' EXIT

          grep -E '^(CONFIG_[A-Za-z0-9_]+=|# CONFIG_[A-Za-z0-9_]+ is not set)' \
            ../old.config | sort > "$old_normalized" || true
          grep -E '^(CONFIG_[A-Za-z0-9_]+=|# CONFIG_[A-Za-z0-9_]+ is not set)' \
            .config | sort > "$new_normalized" || true

          if diff -u --label old.config --label openwrt/.config \
            "$old_normalized" "$new_normalized" > ../logs/config-diff.patch; then
            printf '%s\n' '# Configuration differences' '' \
              'No configuration differences were found after normalization.' \
              > ../logs/config-diff.md
          else
            {
              printf '%s\n' '# Configuration differences' '' \
                'The following configuration options differ between the old and new configs.' '' \
                '```diff'
              cat ../logs/config-diff.patch
              printf '%s\n' '```'
            } > ../logs/config-diff.md
          fi

      - name: Determine parallel make jobs
        shell: bash
        env:
          SINGLE_THREAD_BUILD: ${{ inputs.single_thread_build }}
        run: |
          set -euo pipefail
          if [[ "$SINGLE_THREAD_BUILD" == 'true' ]]; then
            make_jobs=1
          elif [[ "$SINGLE_THREAD_BUILD" == 'false' ]]; then
            make_jobs="$(nproc)"
          else
            echo 'single_thread_build must be true or false.' >&2
            exit 1
          fi
          printf 'MAKE_JOBS=%s\n' "$make_jobs" >> "$GITHUB_ENV"
          echo "Using $make_jobs parallel make jobs."

      - name: Download package sources
        if: ${{ inputs.run_download == 'yes' }}
        working-directory: openwrt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../logs
          log_file=../logs/make-download.log
          set +e
          make download -j"$(nproc)" >"$log_file" 2>&1
          download_status=$?
          set -e
          if [[ "$download_status" -ne 0 ]]; then
            echo 'Package download failed. Last 200 log lines:' >&2
            tail -n 200 "$log_file" >&2
          fi
          exit "$download_status"

      - name: Remove stale SSH continue signal
        if: ${{ inputs.debug_ssh }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f "/tmp/continue"

      - name: Configure SSH debug tips
        if: ${{ inputs.debug_ssh }}
        shell: bash
        run: |
          set -euo pipefail
          sudo tee /etc/profile.d/openwrt-debug-tips.sh >/dev/null <<'EOF'
          if [[ -t 1 ]]; then
            cyan=$'\033[1;36m'
            green=$'\033[1;32m'
            yellow=$'\033[1;33m'
            dim=$'\033[2m'
            reset=$'\033[0m'
          else
            cyan=''
            green=''
            yellow=''
            dim=''
            reset=''
          fi

          printf '\n%s+------------------------------------------------------------+%s\n' "$cyan" "$reset"
          printf '%s|%s                  %sOpenWrt debug session%s                 %s|%s\n' \
            "$cyan" "$reset" "$cyan" "$reset" "$cyan" "$reset"
          printf '%s+------------------------------------------------------------+%s\n' "$cyan" "$reset"
          printf '%s  Commands:%s\n' "$yellow" "$reset"
          printf '  %scd "$GITHUB_WORKSPACE/openwrt"%s                 Enter source directory\n' "$green" "$reset"
          printf '  %stail -f "$GITHUB_WORKSPACE/logs/make-download.log"%s Follow download log\n' "$green" "$reset"
          printf '  %stail -f "$GITHUB_WORKSPACE/logs/make-build.log"%s    Follow build log\n' "$green" "$reset"
          printf '  %sls -lah "$GITHUB_WORKSPACE/openwrt/bin/targets"%s  List firmware outputs\n' "$green" "$reset"
          printf '  %smake menuconfig%s  Open the menuconfig interface\n' "$yellow" "$reset"
          printf '  %smake oldconfig%s  Update the configuration manually\n' "$yellow" "$reset"
          printf '\n%s  When finished, run:%s %snext%s\n' "$yellow" "$reset" "$green" "$reset"
          printf '%s  This will continue the workflow.%s\n' "$dim" "$reset"
          printf '%s+------------------------------------------------------------+%s\n\n' "$cyan" "$reset"
          EOF
          sudo chmod 0644 /etc/profile.d/openwrt-debug-tips.sh
          sudo bash -n /etc/profile.d/openwrt-debug-tips.sh

      - name: Open SSH debug session
        if: ${{ inputs.debug_ssh }}
        uses: owenthereal/action-upterm@v1
        with:
          detached: true
          limit-access-to-actor: true
          wait-timeout-minutes: 30

      - name: Wait for SSH continue signal
        if: ${{ inputs.debug_ssh }}
        shell: bash
        run: |
          set -euo pipefail
          echo 'SSH session is active. Run this command after debugging:'
          echo '  touch /tmp/continue'
          while [[ ! -f /tmp/continue ]]; do
            sleep 5
          done
          echo 'Continue signal received; starting firmware build.'

      - name: Build firmware
        if: ${{ inputs.run_build == 'yes' }}
        working-directory: openwrt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../logs
          log_file=../logs/make-build.log
          echo "Building with $MAKE_JOBS parallel make jobs; full output is saved to $log_file."
          set +e
          make -j"$MAKE_JOBS" V=s >"$log_file" 2>&1
          build_status=$?
          set -e
          if [[ "$build_status" -ne 0 ]]; then
            echo 'Build failed. Last 200 log lines:' >&2
            tail -n 200 "$log_file" >&2
          fi
          exit "$build_status"

      - name: Upload build outputs and logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: openwrt-build-log-${{ github.run_id }}
          path: |
            logs/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      - name: Package build outputs for release
        id: package_release_archive
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          config_file=openwrt/.config
          device_line="$(grep -m 1 -E '^CONFIG_TARGET[^=]*_DEVICE_[^=]+=y$' "$config_file" || true)"
          if [[ -z "$device_line" ]]; then
            echo 'Could not determine the selected target device from openwrt/.config.' >&2
            exit 1
          fi

          device_name="${device_line%%=y}"
          IFS=_ read -r -a device_fields <<< "$device_name"
          if (( ${#device_fields[@]} < 4 )); then
            echo "Unexpected target device configuration: $device_line" >&2
            exit 1
          fi

          chip="${device_fields[2]}"
          model="${device_fields[3]}"
          target="${device_name#*_DEVICE_}"
          target_arch="$(awk -F= '/^CONFIG_TARGET_ARCH_PACKAGES=/{gsub(/["\r]/, "", $2); print $2; exit}' "$config_file")"
          target_arch="${target_arch:-unknown}"
          if [[ "$target" == 'generic' ]]; then
            case "$target_arch" in
              x86_64)
                target='x64'
                ;;
              x86*)
                target='x86'
                ;;
              *)
                echo "Keeping generic target for non-x86 architecture: ${target_arch:-unknown}"
                ;;
            esac
          fi
          if [[ "$target" == 'generic' && "$target_arch" == 'unknown' ]]; then
            echo 'Could not determine the target architecture from openwrt/.config.' >&2
            exit 1
          fi
          ver="$(awk -F= '/^DESTVER=/{print $2; exit}' old.config | tr -d '\r')"
          if [[ -z "$ver" ]]; then
            ver="${TARGET_TAG#v}"
          fi
          if [[ -z "$ver" ]]; then
            echo 'Could not determine the OpenWrt version for the archive name.' >&2
            exit 1
          fi

          config_name="${target}.config"
          mkdir -p openwrt/bin/targets openwrt/bin/packages
          cp "$config_file" "openwrt/bin/$config_name"

          archive_name="openwrt-${chip}-${model}-${target}-v${ver}.zip"
          archive_path="$RUNNER_TEMP/$archive_name"
          rm -f "$archive_path"
          (
            cd openwrt
            zip -r "$archive_path" bin/targets bin/packages "bin/$config_name"
          )
          echo "RELEASE_ARCHIVE=$archive_path" >> "$GITHUB_ENV"
          echo "archive_path=$archive_path" >> "$GITHUB_OUTPUT"
          echo "Archive: $archive_name"

      - name: Upload build archive to GoFile
        if: ${{ always() && steps.package_release_archive.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          download_url="$(curl --fail-with-body --retry 3 --retry-connrefused --retry-delay 3 \
            -F "file=@${RELEASE_ARCHIVE}" \
            https://upload.gofile.io/uploadfile | \
            jq -er '
              if .status != "ok" then
                error("GoFile upload failed: " + (.status // "unknown"))
              elif (.data.downloadPage | type) != "string" then
                error("GoFile response did not contain data.downloadPage")
              else
                .data.downloadPage
              end
            ')"

          echo "GoFile download link: $download_url"
          {
            echo '### GoFile upload'
            echo
            echo "Download link: $download_url"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build outputs and logs to GitHub Release
        if: ${{ always() && steps.package_release_archive.outcome == 'success' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: openwrt-build-${{ github.run_id }}
          name: OpenWrt build ${{ github.run_id }}
          target_commitish: ${{ github.sha }}
          files: ${{ steps.package_release_archive.outputs.archive_path }}
          fail_on_unmatched_files: true

      - name: Stop SSH debug session
        if: ${{ always() && inputs.debug_ssh }}
        shell: bash
        run: |
          set +e
          pkill -TERM -x upterm
          pkill -TERM -x tmux
          true
