name: build-openwrt
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      new: ${{ steps.cmp.outputs.new }}
      tag: ${{ steps.cmp.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: cmp
        run: |
          latest=$(git ls-remote --tags --refs https://github.com/openwrt/openwrt 'v[0-9]*' \
            | awk -F/ '{print $3}' | grep -v -- '-rc' | sort -V | tail -1)
          last=$(cat .last_version 2>/dev/null || echo none)
          echo "tag=$latest" >> $GITHUB_OUTPUT
          if [ "$latest" != "$last" ]; then echo "new=true" >> $GITHUB_OUTPUT; else echo "new=false" >> $GITHUB_OUTPUT; fi
          echo "latest=$latest last=$last new=$(grep '^new=' $GITHUB_OUTPUT | cut -d= -f2)" | tee -a $GITHUB_STEP_SUMMARY
