name: Test SSH debug session

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-ssh:
    name: Test runner SSH connection
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Open Upterm SSH session
        uses: owenthereal/action-upterm@v1
        with:
          limit-access-to-actor: true
          wait-timeout-minutes: 30

      - name: Verify session released the runner
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner: $(uname -a)"
          echo "CPU cores: $(nproc)"
          echo 'SSH debug session test passed.'
