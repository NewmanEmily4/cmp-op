name: Test SSH debug session

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-ssh:
    name: Test runner SSH connection
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Remove stale continue signals
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$GITHUB_WORKSPACE/continue"
          sudo rm -f /continue

      - name: Open Upterm SSH session
        uses: owenthereal/action-upterm@v1
        with:
          detached: true
          limit-access-to-actor: true
          wait-timeout-minutes: 30

      - name: Wait for explicit continue signal
        shell: bash
        run: |
          set -euo pipefail
          echo 'SSH session is active. Run one of these commands after debugging:'
          echo '  cd "$GITHUB_WORKSPACE" && touch continue'
          echo '  sudo touch /continue'
          while [[ ! -f "$GITHUB_WORKSPACE/continue" && ! -f /continue ]]; do
            sleep 5
          done
          echo 'Continue signal received.'

      - name: Verify session released the runner
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner: $(uname -a)"
          echo "CPU cores: $(nproc)"
          echo 'SSH debug session test passed.'
